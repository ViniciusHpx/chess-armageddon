<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess Armageddon</title>
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }

            /* --- Tela de entrada do nome (ver src/ui/NameGate.js) --- */
            #name-gate {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background-color: #040218;
                z-index: 10;
            }

            #name-gate[hidden] {
                display: none;
            }

            #name-gate h1 {
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: clamp(28px, 6vw, 56px);
                color: #ffffff;
                letter-spacing: 2px;
                text-align: center;
            }

            #name-gate label {
                font-size: 16px;
                color: #9d9ab5;
            }

            #name-input {
                width: min(340px, 80vw);
                padding: 14px 16px;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 24px;
                text-align: center;
                color: #ffffff;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
                outline: none;
            }

            #name-input:focus {
                border-color: #ffd447;
            }

            #name-gate button {
                width: min(340px, 80vw);
                padding: 16px;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 24px;
                color: #ffffff;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
                cursor: pointer;
            }

            #name-gate button:hover:not(:disabled) {
                background-color: #3a3a3a;
            }

            #name-gate button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            /*
                Lobby. Herda a mesma linguagem da tela de nome (fundo escuro,
                caixa preta com borda branca, Arial Black) — os botões usam a
                mesma regra do #name-gate, por isso os seletores estão juntos
                mais abaixo em vez de duplicados.
            */
            #lobby {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                padding: 24px 16px;
                overflow-y: auto;
                background-color: #040218;
                z-index: 10;
            }

            #lobby[hidden] {
                display: none;
            }

            #lobby h1 {
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: clamp(22px, 4vw, 36px);
                color: #ffffff;
                letter-spacing: 2px;
                text-align: center;
            }

            #lobby-status {
                font-size: 14px;
                color: #9d9ab5;
            }

            #lobby-list {
                width: min(460px, 92vw);
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .lobby-room {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 12px 14px;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
            }

            .lobby-room strong {
                display: block;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 18px;
                color: #ffffff;
            }

            .lobby-room span {
                font-size: 13px;
                color: #9d9ab5;
            }

            #lobby-form {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: min(460px, 92vw);
                padding: 14px;
                background-color: #14122a;
                border: 3px solid rgba(255, 255, 255, 0.4);
                border-radius: 6px;
            }

            #lobby-form[hidden] {
                display: none;
            }

            #lobby-form label {
                font-size: 14px;
                color: #9d9ab5;
            }

            #lobby-bots,
            #lobby-mode {
                width: 100%;
            }

            #lobby button,
            .lobby-room button {
                padding: 12px 18px;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 16px;
                color: #ffffff;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
                cursor: pointer;
            }

            #lobby button:hover:not(:disabled),
            .lobby-room button:hover:not(:disabled) {
                background-color: #3a3a3a;
            }

            #lobby button:disabled,
            .lobby-room button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            #lobby-create {
                width: min(340px, 80vw);
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <!--
            Tela de nome. Nasce ESCONDIDA e quem a mostra é o
            `askPlayerName()` de `NameGate.js`, só quando ainda não há nome.

            Começar visível fazia a tela piscar em toda carga de página que já
            tinha nome — o F5 e, principalmente, a revanche, que entra na sala
            nova recarregando a página: o navegador pintava a tela de nome até
            o `main.js` rodar e escondê-la.
        -->
        <div id="name-gate" hidden>
            <h1>CHESS ARMAGEDDON</h1>
            <label for="name-input">Seu nome na arena</label>
            <input id="name-input" type="text" maxlength="16" autocomplete="off"
                   spellcheck="false" placeholder="peão sem medo" autofocus>
            <button id="name-submit" type="button" disabled>ENTRAR</button>
        </div>
        <!--
            Lobby. Aparece depois da tela de nome e antes de o Phaser subir;
            `Lobby.js` cuida da lista (empurrada pelo lobby do Colyseus, sem
            polling) e some assim que o jogador escolhe uma sala.
        -->
        <div id="lobby" hidden>
            <h1>SALAS</h1>
            <p id="lobby-status">Procurando salas...</p>
            <ul id="lobby-list"></ul>

            <button id="lobby-create" type="button">CRIAR SALA</button>

            <div id="lobby-form" hidden>
                <label for="lobby-mode">Modo de jogo</label>
                <select id="lobby-mode">
                    <option value="team_deathmatch" selected>Team Deathmatch</option>
                    <option value="capture_the_flag">Rouba Bandeira</option>
                    <option value="free_for_all">Todos contra Todos</option>
                </select>

                <label for="lobby-bots">Bots por time (o servidor completa os times)</label>
                <select id="lobby-bots">
                    <option value="0">0 bots</option>
                    <option value="1">1 bot</option>
                    <option value="2">2 bots</option>
                    <option value="3">3 bots</option>
                    <option value="4" selected>4 bots</option>
                    <option value="5">5 bots</option>
                </select>
                <button id="lobby-confirm" type="button">CRIAR E ENTRAR</button>
                <button id="lobby-cancel" type="button">CANCELAR</button>
            </div>
        </div>

        <!--
            Ambos são vendorizados e expõem globais (Phaser, Colyseus). Os
            módulos de src/ os consomem sem import, como já era o caso do Phaser.
            colyseus.js é cópia de
            chess-armageddon-server/node_modules/@colyseus/sdk/dist/colyseus.js

            `phaser.min.js` é o build MINIFICADO do Phaser 3.90.0 (`dist/` do
            pacote npm de mesma versão), 1,1 MB. O `phaser.js` ao lado é o build
            de desenvolvimento da MESMA versão, 7,6 MB e 248 mil linhas: o custo
            dele não é o download (num app ele é local), é o PARSE — segundos de
            espera antes do primeiro quadro num Android médio. Ele fica no
            repositório só como rota de volta; trocar a linha abaixo desfaz.

            Ao empacotar o app, o `phaser.js` NÃO pode ir junto: seriam 7,6 MB
            mortos dentro do APK.
        -->
        <script src="./phaser.min.js"></script>
        <script src="./colyseus.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
