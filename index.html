<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess Armageddon</title>
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }

            /* --- Tela de entrada do nome (ver src/ui/NameGate.js) --- */
            #name-gate {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background-color: #040218;
                z-index: 10;
            }

            #name-gate[hidden] {
                display: none;
            }

            #name-gate h1 {
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: clamp(28px, 6vw, 56px);
                color: #ffffff;
                letter-spacing: 2px;
                text-align: center;
            }

            #name-gate label {
                font-size: 16px;
                color: #9d9ab5;
            }

            #name-input {
                width: min(340px, 80vw);
                padding: 14px 16px;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 24px;
                text-align: center;
                color: #ffffff;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
                outline: none;
            }

            #name-input:focus {
                border-color: #ffd447;
            }

            #name-gate button {
                width: min(340px, 80vw);
                padding: 16px;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: 24px;
                color: #ffffff;
                background-color: #1e1e1e;
                border: 3px solid rgba(255, 255, 255, 0.9);
                border-radius: 6px;
                cursor: pointer;
            }

            #name-gate button:hover:not(:disabled) {
                background-color: #3a3a3a;
            }

            #name-gate button:disabled {
                opacity: 0.4;
                cursor: default;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>

        <!--
            Tela de nome. Fica visível antes do Phaser subir; `NameGate.js` a
            esconde assim que o jogador confirma. Marcada como `hidden` no
            modo offline e quando veio `?name=` na URL.
        -->
        <div id="name-gate">
            <h1>CHESS ARMAGEDDON</h1>
            <label for="name-input">Seu nome na arena</label>
            <input id="name-input" type="text" maxlength="16" autocomplete="off"
                   spellcheck="false" placeholder="peão sem medo" autofocus>
            <button id="name-submit" type="button" disabled>ENTRAR</button>
        </div>
        <!--
            Ambos são vendorizados e expõem globais (Phaser, Colyseus). Os
            módulos de src/ os consomem sem import, como já era o caso do Phaser.
            colyseus.js é cópia de
            chess-armageddon-server/node_modules/@colyseus/sdk/dist/colyseus.js
        -->
        <script src="./phaser.js"></script>
        <script src="./colyseus.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
